# ==============================================================================
# AtlasOS Docker Compose
# Orchestrates: PostgreSQL, Redis, Qdrant, FastAPI Backend, Celery Workers,
#               Celery Beat Scheduler, and Next.js Frontend.
#
# Usage:
#   Development:  docker-compose up -d
#   Logs:         docker-compose logs -f backend
#   Rebuild:      docker-compose up -d --build backend
#   Teardown:     docker-compose down -v  (removes volumes)
# ==============================================================================

version: "3.9"

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 15 — System of Record
  # Stores all persistent structured data. RLS enforced at the database level.
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: atlasos-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - atlasos_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Redis 7 — Cache, Sessions, Rate Limits, Celery Broker
  # DB 0: App cache & working memory
  # DB 1: Celery broker
  # DB 2: Celery results
  # DB 3: Reserved for testing
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: atlasos-redis
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    networks:
      - atlasos_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Qdrant — Vector Database for Semantic Search
  # Stores 1024-dimensional embeddings for episodic and semantic memories.
  # Collection: atlas_memories (created by init_qdrant.py)
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: atlasos-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    networks:
      - atlasos_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # AI Inference Service
  # ----------------------------------------------------------------------------
  inference:
    build:
      context: ./inference
      dockerfile: Dockerfile
    container_name: atlasos-inference
    ports:
      - "8080:8080"
    networks:
      - atlasos_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 4G
        limits:
          memory: 8G

  # ----------------------------------------------------------------------------
  # FastAPI Backend — Core API Server
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atlasos-backend
    command: /bin/bash /app/entrypoint.sh
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - atlasos_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      inference:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Celery Worker — Background Task Processing
  # Handles: compression, evaluation runs, ranking refresh, retention sweeps,
  #          webhook deliveries.
  # ----------------------------------------------------------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atlasos-celery-worker
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=4
    env_file: .env
    volumes:
      - ./backend:/app
    networks:
      - atlasos_network
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Celery Beat — Periodic Task Scheduler
  # Schedules: daily compression, retention sweeps, evaluation runs.
  # ----------------------------------------------------------------------------
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atlasos-celery-beat
    command: celery -A app.worker.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file: .env
    volumes:
      - ./backend:/app
    networks:
      - atlasos_network
    depends_on:
      celery_worker:
        condition: service_started
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Next.js Frontend — Developer Console
  # Serves the admin dashboard, memory explorer, and settings UI.
  # Built in Phase 5. Commented out until then.
  # ----------------------------------------------------------------------------
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: atlasos-frontend
  #   ports:
  #     - "3000:3000"
  #   env_file: .env
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #     - /app/.next
  #   networks:
  #     - atlasos_network
  #   depends_on:
  #     backend:
  #       condition: service_started
  #   restart: unless-stopped

# ==============================================================================
# Named Volumes — Persistent data storage across container restarts
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local

# ==============================================================================
# Network — Isolated bridge network for inter-service communication
# ==============================================================================
networks:
  atlasos_network:
    driver: bridge
    name: atlasos_network
