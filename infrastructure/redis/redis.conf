# ==============================================================================
# AtlasOS Redis Configuration
#
# Tuned for a production-grade caching and message broker workload.
#
# Database Allocation:
#   DB 0 — Application cache (working memory, session cache, rate limits)
#   DB 1 — Celery broker (task messages)
#   DB 2 — Celery results backend (task results)
#   DB 3 — Reserved for integration testing
#
# Memory Policy:
#   allkeys-lru evicts the least recently used keys across ALL databases
#   when maxmemory is reached. This is appropriate because:
#   - Working memory and session caches are ephemeral by design.
#   - Rate limit counters have short TTLs and self-expire.
#   - Celery manages its own key lifecycle.
# ==============================================================================

# --- Network ---
# bind to all interfaces (container networking handles isolation)
bind 0.0.0.0

# Disable protected mode since access is restricted to Docker network
protected-mode no

# TCP keepalive to detect dead connections
tcp-keepalive 300

# Client idle timeout (0 = disabled, Celery workers maintain persistent connections)
timeout 0

# --- Memory ---
# Maximum memory allocation for this Redis instance
maxmemory 256mb

# Eviction policy: remove least recently used keys when memory is full
maxmemory-policy allkeys-lru

# --- Persistence ---
# Append-Only File (AOF) for durability
# Why AOF: Provides better durability guarantees than RDB snapshots alone.
# fsync every second balances durability with performance.
appendonly yes
appendfsync everysec

# RDB snapshots as a backup persistence mechanism
# Format: save <seconds> <min-writes>
save 900 1
save 300 10
save 60 10000

# --- Database Count ---
# 4 databases: app, celery-broker, celery-results, testing
databases 4

# --- Logging ---
loglevel notice
